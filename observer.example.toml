[server]
bind = "127.0.0.1:4765"
bearer_token_file = "observer-data/token"
strict_origin = true
allowed_origins = ["http://127.0.0.1:4765"]

[server.tailscale_serve]
enabled = false
https_port = 443

# V2 mutations remain unavailable unless this is explicitly enabled. The
# Controller reuses the existing V1 bearer, pairing Cookie, or verified
# Tailscale identity; it does not create a second control credential. If both
# Controller and Tailscale Serve are enabled, every verified Tailnet user
# accepted by Serve has the same V2 mutation authority as a local session.
[controller]
enabled = false
# off keeps every Session mutation disabled; tui enables the real Codex TUI
# Session Runtime and starts one dedicated App Server for each Worker.
session_kernel = "off"
# Development/test only; when session_kernel="preview" this must point to one fixed
# executable. Browser requests can never supply an executable or argv.
# session_fixture_cli = "tests/fixtures/fake_codex_cli.sh"

[storage]
database = "observer-data/observer.sqlite"
blob_dir = "observer-data/blobs"
fingerprint_key_file = "observer-data/fingerprint.key"
raw_event_retention_days = 30
delta_retention_days = 7
blob_retention_days = 14

[[sources]]
name = "default"
codex_home = "~/.codex"
scan_interval_seconds = 30

[capture]
max_raw_event_bytes = 67108864
inline_blob_bytes = 262144
keep_reasoning = true
keep_raw_json = true
ingest_queue_events = 4096
api_consumer_queue_events = 512
