[server]
bind = "127.0.0.1:4767"
bearer_token_file = "../target/session-kernel-preview/token"
strict_origin = true
allowed_origins = ["http://127.0.0.1:4767"]

[controller]
enabled = true
session_kernel = "preview"
session_fixture_cli = "../tests/fixtures/fake_codex_cli.sh"

[storage]
database = "../target/session-kernel-preview/observer.sqlite"
blob_dir = "../target/session-kernel-preview/blobs"
fingerprint_key_file = "../target/session-kernel-preview/fingerprint.key"

[[sources]]
name = "session-kernel-fixture"
codex_home = "codex-home"
live_mode = "off"
scan_interval_seconds = 30

[capture]
max_raw_event_bytes = 67108864
inline_blob_bytes = 262144
keep_reasoning = true
keep_raw_json = true
ingest_queue_events = 4096
api_consumer_queue_events = 512
