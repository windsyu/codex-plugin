[package]
name = "codex-local-observer"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Local Codex observer and auditable V2 control gateway"

[[bin]]
name = "codex-observerd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
libc = "0.2"
notify = "8"
portable-pty = "0.9"
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29"
toml = "0.9"
tower-http = { version = "0.6", features = ["catch-panic", "request-id", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
vt100 = "0.16"
walkdir = "2"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
