[package]
name = "codex-local-observer"
version = "0.5.1"
edition = "2024"
license = "MIT"
description = "Native Codex CLI workbench with read-only Observer history compatibility"
default-run = "codex-view"

[workspace]
members = ["crates/relay-protocol", "crates/workbench-assets", "relay"]
# Plain Cargo commands target the local product. Standard full checks use --workspace.
default-members = ["."]
resolver = "3"

[[bin]]
name = "codex-observerd"
path = "src/main.rs"

[[bin]]
name = "codex-view"
path = "src/bin/codex-view.rs"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
notify = "8"
portable-pty = "0.9"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["stream", "http2", "rustls-tls-native-roots"] }
rusqlite = { version = "0.37", features = ["bundled", "hooks", "limits"] }
# Keep the built UI and API together in local trial binaries as well as releases.
codex-workbench-assets = { path = "crates/workbench-assets" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_path_to_error = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
toml = "0.9"
tempfile = "3"
tower-http = { version = "0.6", features = ["catch-panic", "request-id", "set-header", "trace"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
vt100 = "0.16"
walkdir = "2"
zstd = "0.13"
codex-relay-protocol = { path = "crates/relay-protocol" }

[dev-dependencies]
# Cross-end authorization/stream fixtures only; not a workbench production dependency.
codex-relayd = { path = "relay" }

# 0.16.2 with the reviewed wide-cell resize fix; see vendor/vt100/PATCH.md.
[patch.crates-io]
vt100 = { path = "vendor/vt100" }

[build-dependencies]
# Already used by native dependencies; compile the macOS folder picker at build time.
cc = "1"
